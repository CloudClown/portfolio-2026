<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- T-99 phosphor build mark: caution chip, pixel "99", 99% progress bar -->
  <rect width="64" height="64" rx="6" fill="#0a0a0b"/>
  <rect x="3" y="3" width="58" height="58" rx="4" fill="none" stroke="#ffd400" stroke-width="4"/>
  <text x="32" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="30" font-weight="700" fill="#ffd400" letter-spacing="-1">99</text>
  <rect x="10" y="50" width="38" height="5" fill="#ffd400"/>
  <rect x="52" y="50" width="2" height="5" fill="#1c1c1e"/>
</svg>
